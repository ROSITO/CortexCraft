# Pattern aligned with storytold/artcraft artcraft-windows-publish.yml
name: CortexCraft Windows release

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-windows:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: tauri-windows

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: CortexCraft v__VERSION__
          releaseBody: |
            Multi-platform Phase 1 build (ArtCraft / storytold-style release pipeline).

            See assets for Windows installer(s). macOS and Linux workflows attach to the same draft release.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
