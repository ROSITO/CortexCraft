name: Bug report
description: Report a reproducible problem in CortexCraft
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first.
        **Do not** include vault contents, tokens, or Keychain secrets.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps starting from a clean launch when possible.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CortexCraft version
      description: App version (e.g. 0.1.0) or git commit SHA.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version
      placeholder: "15.x"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Graph / Brain 3D
        - Vault scan / live update
        - Notes (edit / capture / new note)
        - Agents / MCP
        - Claude headless / keeper
        - Imports
        - Settings / first-run
        - Packaging / install
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs (redact paths if sensitive). Attach screenshots if useful.
